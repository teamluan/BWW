name: Sync BWW to Teufel2211/bww

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'teamluan/BWW'
    runs-on: ubuntu-24.04
    steps:
      - name: Mirror repository to private repository
        env:
          MIRROR_TOKEN: ${{ secrets.BWW_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "::error::BWW_SYNC_TOKEN is not configured."
            exit 1
          fi

          echo "Cloning source repository as a full mirror..."
          git clone --mirror https://github.com/teamluan/BWW.git source.git
          cd source.git

          # Authenticate Git directly with the Classic PAT.
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/Teufel2211/bww.git"

          echo "Reading current target refs..."
          SOURCE_HEADS="$(git for-each-ref --format='%(refname) %(objectname)' refs/heads | sort)"
          TARGET_HEADS="$(git ls-remote --heads mirror | awk '{print $2" "$1}' | sort)"
          SOURCE_TAGS="$(git for-each-ref --format='%(refname) %(objectname)' refs/tags | sort)"
          TARGET_TAGS="$(git ls-remote --tags mirror | awk '$2 !~ /\\^\\{\\}$/ {print $2" "$1}' | sort)"

          echo "Checking whether source and target are already synchronized..."

          if [ "${SOURCE_HEADS}" = "${TARGET_HEADS}" ] && [ "${SOURCE_TAGS}" = "${TARGET_TAGS}" ]; then
            echo "Already synchronized. No push required."
            exit 0
          fi

          echo "Differences detected. Performing full mirror push..."
          git push mirror --mirror --force

          echo "Verifying target refs after synchronization..."
          TARGET_HEADS_AFTER="$(git ls-remote --heads mirror | awk '{print $2" "$1}' | sort)"
          TARGET_TAGS_AFTER="$(git ls-remote --tags mirror | awk '$2 !~ /\\^\\{\\}$/ {print $2" "$1}' | sort)"

          if [ "${SOURCE_HEADS}" != "${TARGET_HEADS_AFTER}" ] || [ "${SOURCE_TAGS}" != "${TARGET_TAGS_AFTER}" ]; then
            echo "::error::Mirror verification failed: source and target refs differ after push."
            exit 1
          fi

          echo "Mirror synchronization verified successfully."
