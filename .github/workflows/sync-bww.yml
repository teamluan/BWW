name: Sync BWW to Teufel2211/bww

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch mirror workflow
        env:
          SYNC_TOKEN: ${{ secrets.BWW_SYNC_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error::BWW_SYNC_TOKEN is not configured."
            exit 1
          fi

          echo "Dispatching mirror workflow for commit ${SOURCE_SHA}..."

          HTTP_STATUS="$(curl -sS -o /tmp/dispatch-response -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Teufel2211/bww/actions/workflows/mirror-bww.yml/dispatches \
            -d "{"ref":"main","inputs":{"source_sha":"${SOURCE_SHA}"}}")"

          if [ "${HTTP_STATUS}" != "204" ]; then
            echo "::error::Mirror workflow dispatch failed with HTTP ${HTTP_STATUS}."
            cat /tmp/dispatch-response
            exit 1
          fi

          echo "Mirror workflow dispatched successfully.";
