name: Sync BWW to Teufel2211/bww

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify mirror access
        env:
          SYNC_TOKEN: ${{ secrets.BWW_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error::BWW_SYNC_TOKEN is not configured."
            exit 1
          fi

          echo "Testing authenticated access to Teufel2211/bww..."

          api_status="$(curl -sS -o /tmp/bww-repo.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Teufel2211/bww")"

          case "${api_status}" in
            200)
              echo "Authenticated repository access: OK"
              ;;
            401)
              echo "::error::GitHub rejected the token (HTTP 401). Check that the token is valid and not expired."
              exit 1
              ;;
            403)
              echo "::error::GitHub denied repository access (HTTP 403). Check the token's repository selection and Code permission."
              exit 1
              ;;
            404)
              echo "::error::GitHub returned 404. The token cannot see Teufel2211/bww. Check that this exact private repository is selected in the fine-grained token."
              exit 1
              ;;
            *)
              echo "::error::GitHub API returned HTTP ${api_status}."
              cat /tmp/bww-repo.json
              exit 1
              ;;
          esac

      - name: Push main to mirror repository
        env:
          SYNC_TOKEN: ${{ secrets.BWW_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          git remote add mirror "https://x-access-token:${SYNC_TOKEN}@github.com/Teufel2211/bww.git"
          git push mirror HEAD:main --force
