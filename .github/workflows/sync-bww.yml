name: Sync BWW to Teufel2211/bww

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'teamluan/BWW'
    runs-on: ubuntu-24.04
    steps:
      - name: Mirror repository to private repository
        env:
          MIRROR_TOKEN: ${{ secrets.BWW_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "::error::BWW_SYNC_TOKEN is not configured."
            exit 1
          fi

          echo "Cloning source repository as a full mirror..."
          git clone --mirror https://github.com/teamluan/BWW.git source.git
          cd source.git

          # Authenticate Git directly with the Classic PAT.
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/Teufel2211/bww.git"

          echo "Fetching current target refs..."
          git fetch mirror --prune '+refs/heads/*:refs/remotes/mirror/*' '+refs/tags/*:refs/tags/*'

          echo "Comparing source and target refs..."

          SOURCE_REFS="$(git for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags | sort)"
          TARGET_REFS="$(git for-each-ref --format='%(refname:strip=3) %(objectname)' refs/remotes/mirror refs/tags | sort)"

          # Normalize target branch refs to refs/heads/* so the comparison is exact.
          TARGET_REFS="$(git for-each-ref --format='%(refname:strip=3) %(objectname)' refs/remotes/mirror | sed 's#^#refs/heads/#'; git for-each-ref --format='%(refname) %(objectname)' refs/tags | sort | uniq)";

          SOURCE_HEADS="$(git for-each-ref --format='%(refname) %(objectname)' refs/heads | sort)"
          TARGET_HEADS="$(git for-each-ref --format='refs/heads/%(refname:strip=3) %(objectname)' refs/remotes/mirror | sort)"
          SOURCE_TAGS="$(git for-each-ref --format='%(refname) %(objectname)' refs/tags | sort)"
          TARGET_TAGS="$(git for-each-ref --format='%(refname) %(objectname)' refs/tags | sort)"

          if [ "${SOURCE_HEADS}" = "${TARGET_HEADS}" ] && [ "${SOURCE_TAGS}" = "${TARGET_TAGS}" ]; then
            echo "Already synchronized. No push required."
            exit 0
          fi

          echo "Differences detected. Pushing full mirror..."
          git push mirror --mirror --force

          echo "Verifying target refs after synchronization..."
          git fetch mirror --prune '+refs/heads/*:refs/remotes/mirror/*' '+refs/tags/*:refs/tags/*'

          SOURCE_HEADS_AFTER="$(git for-each-ref --format='%(refname) %(objectname)' refs/heads | sort)"
          TARGET_HEADS_AFTER="$(git for-each-ref --format='refs/heads/%(refname:strip=3) %(objectname)' refs/remotes/mirror | sort)"
          SOURCE_TAGS_AFTER="$(git for-each-ref --format='%(refname) %(objectname)' refs/tags | sort)"
          TARGET_TAGS_AFTER="$(git for-each-ref --format='%(refname) %(objectname)' refs/tags | sort)"

          if [ "${SOURCE_HEADS_AFTER}" != "${TARGET_HEADS_AFTER}" ] || [ "${SOURCE_TAGS_AFTER}" != "${TARGET_TAGS_AFTER}" ]; then
            echo "::error::Mirror verification failed: source and target refs differ."
            exit 1
          fi

          echo "Mirror synchronization verified successfully."
