name: CI

on:
  push:
    branches: ["main", "development", "fix/**"]
  pull_request:
    branches: ["main", "development"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm run check
